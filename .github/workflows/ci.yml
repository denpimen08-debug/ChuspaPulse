name: CI
on:
  pull_request:
    branches: [dev, main]

jobs:
  validar-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar descripción del PR
        run: |
          if [ -z "${{ github.event.pull_request.body }}" ]; then
            echo "El PR debe tener descripción"
            exit 1
          fi
          echo "✅ PR tiene descripción"

      - name: Verificar que referencia un issue
        run: |
          if ! echo "${{ github.event.pull_request.body }}" | grep -qi "closes #\|fixes #\|refs #"; then
            echo "El PR debe referenciar un issue con 'Closes #N'"
            exit 1
          fi
          echo "✅ PR referencia un issue"

      - name: Verificar actualización de CHANGELOG
        run: |
          LABELS="${{ join(github.event.pull_request.labels.*.name, ' ') }}"

          if echo "$LABELS" | grep -qw "skip-changelog"; then
            echo "✅ Verificación omitida por etiqueta skip-changelog"
            exit 0
          fi

          git fetch origin ${{ github.base_ref }}

          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          if echo "$CHANGED_FILES" | grep -q "^src/"; then
            if ! echo "$CHANGED_FILES" | grep -qx "CHANGELOG.md"; then
              echo "❌ Este PR modifica archivos en src/ pero no actualiza CHANGELOG.md."
              echo "Agrega una entrada al CHANGELOG o aplica la etiqueta skip-changelog si corresponde."
              exit 1
            fi
          fi

          echo "✅ Verificación de CHANGELOG superada"

  build-and-test:
    needs: validar-pr
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # Generar version.hpp usando Inline Python multisistema simple
      - name: Crear version.hpp
        run: |
          python -c "import os; os.makedirs('src/core', exist_ok=True); f=open('src/core/version.hpp','w'); f.write('#ifndef PULSO_VERSION_HPP\n#define PULSO_VERSION_HPP\n#define PULSO_VERSION \"0.1.0\"\n#endif\n'); f.close()"

      - name: Instalar dependencias (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgtest-dev libsqlite3-dev

      - name: Instalar dependencias (macOS)
        if: runner.os == 'macOS'
        run: brew install googletest sqlite3

      - name: Instalar GoogleTest vía vcpkg (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install gtest:x64-windows

      - name: Configurar CMake (Linux / macOS)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DBUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Configurar CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DBUILD_TESTS=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Compilar
        run: cmake --build build

      - name: Install clang-tidy (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y clang-tidy-14
          sudo ln -sf /usr/bin/clang-tidy-14 /usr/bin/clang-tidy

      - name: Run clang-tidy (Linux)
        if: runner.os == 'Linux'
        run: |
          find src/ -type f \( -name "*.cpp" -o -name "*.cxx" -o -name "*.cc" \) -print0 | \
          xargs -0 -r clang-tidy --config-file=.clang-tidy -p build

      - name: Ejecutar tests
        run: ctest --test-dir build --output-on-failure

      - name: Memory leaks con Valgrind (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --leak-check=full --error-exitcode=1 ./build/tests/pulso_tests